# Mock AG: hold-then-release over the mock ledger and the mock judge MJ (SPEC 9.1 flag names).
system_id: AG
impl: mock
flags:
  engine: mock
  gate: ag
  harm_scan: "off"            # harm path (LG) is S3 work
  harm_guard: mock
  output_guard: "off"
  inj_path: "on"
  scorer: ledger
  scorer_combine: none
  selector: { rule: topk, k: 8, layers: tracked8, head_weighting: uniform, first_token: skip }
  judge: MJ
  # judge_windows: the mock judges the target's own grid (split_tokens x 2); leave unset
  thresholds: { MJ: { F5: 0.5, F1: 0.8, R80: 0.5 } }
  block_before_generation: false
  judge_all_before_first_release: false
  release_before_verdict: false
  overlap: true
  verdict_cache: per_request
  scheduler: none
  chunking: { first: 8, next: 32, sentence: false }
  deadline_budget_ms: { release: 1000, commit: 2000 }
  evaluation_only: false
  mock:
    target: { kind: synthetic, concentration: 0.6, gen_share: 0.1, success_rate: 0.7 }
    judge: { false_positive_rate: 0.01, base_ms: 5.0, per_window_ms: 2.0 }
    prefill_us_per_token: 20.0
    tpot_ms: 20.0
    gate_us: 50.0
